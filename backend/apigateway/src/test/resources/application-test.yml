server:
  port: 8000

spring:
  application:
    name: apigateway
  cloud:
    bus:
      enabled: false
    stream:
      function:
        autodetect: false
    function:
      definition: ""
  rabbitmq:
    listener:
      simple:
        auto-startup: false

file:
  directory: ${user.home}/msa-attach-volume
messages:
  # 외부 공유 볼륨(portal-service 생성) 대신 저장소에 포함된 테스트 전용 메시지 디렉터리를 사용한다.
  # 운영과 동일하게 file:// 기반 default 프로파일 경로로 로드된다(Gradle test 의 user.dir = 모듈 루트).
  directory: ${user.dir}/src/test/resources/test-messages

# jwt token
token:
  secret: egovframe_user_token

# ftp server
ftp:
  enabled: false # ftp 사용 여부, FTP 서버에 최상위 디렉토리 자동 생성 및 구현체를 결정하게 된다.

# eureka 가 포함되면 eureka server 도 등록되므로 해제한다.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
