name: Fork CI
on:
  pull_request:
    branches: [work]
  push:
    branches: [work]
permissions:
  contents: read
jobs:
  backend:
    if: github.repository == 'leejongyoung/egovframe-msa-edu'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apigateway
          - board-service
          - config
          - discovery
          - egovframe-cloud-module-common
          - portal-service
          - reserve-check-service
          - reserve-item-service
          - reserve-request-service
          - user-service
        include:
          - { service: config, gradle: build }
          - { service: discovery, gradle: build }
          - { service: egovframe-cloud-module-common, gradle: build }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build service
        run: cd backend/${{ matrix.service }} && ./gradlew --no-daemon ${{ matrix.gradle || 'build -x test' }}
  frontend:
    if: github.repository == 'leejongyoung/egovframe-msa-edu'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: cd frontend/${{ matrix.app }} && npm ci
      - name: Build app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: cd frontend/${{ matrix.app }} && npm run build --if-present
